# Security headers for every response. Included in the server block and again in each location that sets its own
# add_header, because nginx drops the inherited add_header lines in such a location.
# antd writes its styles as inline <style> tags, so styles need 'unsafe-inline'; scripts do not. Web Serial is the
# only device API the app uses.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "serial=(self), camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
